name: Gerar APK Android (AutoChamada)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar AutoChamada APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do projeto
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Gradle 8.7 (Sem necessidade de gradle-wrapper.jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: 6. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: AutoChamada-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
